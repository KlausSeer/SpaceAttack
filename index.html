<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Attack</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header><div><h1>SPACE <span>ATTACK</span></h1></div></header>
    <section class="arena" aria-label="Space Attack game">
      <div class="hud"><div>SCORE <strong id="score">000000</strong></div><div>WAVE <strong id="wave">01</strong></div><div>LIVES <strong id="health">♥ ♥ ♥ ♥ ♥</strong></div></div>
      <canvas id="game" width="960" height="640" aria-label="Spaceship combat arena. Move with WASD or arrow keys; fire with Space."></canvas>
      <div id="overlay" class="overlay">
        <div class="panel"><span class="eyebrow" id="screen-label" hidden></span><h2 id="screen-title">Ready to play?</h2><div id="final-result" hidden><span class="eyebrow">FINAL SCORE</span><strong id="final-score">0</strong><span id="final-wave"></span></div><p id="screen-description">Destroy all enemies to clear each wave.</p><button id="action">Start game</button><p class="hint">or press Enter</p></div>
      </div>
      <div id="announcement" class="announcement" role="status" aria-live="polite"></div>
    </section>
    <footer><span><kbd>W A S D</kbd> / <kbd>↑ ← ↓ →</kbd> Move</span><span><kbd>SPACE</kbd> Fire · hold to repeat</span><span><kbd>P</kbd> Pause</span></footer>
  </main>
</body>
</html>
